<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="box-slide-t box-slide-d"><title id="box-slide-t">The run sandbox</title><desc id="box-slide-d">Source and match data enter a digest-pinned container through read-only mounts. The container has no network and a read-only root filesystem; the only writable mount is the output folder outside the repository.</desc><defs><marker id="box-slide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C84AA"/></marker><linearGradient id="box-slide-tri" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#004D98"/><stop offset=".33" stop-color="#004D98"/><stop offset=".33" stop-color="#C4F000"/><stop offset=".67" stop-color="#C4F000"/><stop offset=".67" stop-color="#A50044"/><stop offset="1" stop-color="#A50044"/></linearGradient></defs><rect x="0.0" y="20.0" width="200.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#D8DEEA" stroke-width="1.2"/><rect x="0.0" y="20.0" width="200.0" height="5.0" rx="0" fill="url(#box-slide-tri)"/><rect x="16.0" y="36.0" width="96.7" height="20.0" rx="2" fill="#C4F000"/><text x="23.0" y="51.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="12.9" font-weight="600" fill="#0B1433" text-anchor="start" letter-spacing="0.08em">READ-ONLY</text><text x="16.0" y="85.7" font-family="'Big Shoulders Display', 'Bahnschrift SemiBold Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif" font-size="29.1" font-weight="800" fill="#0B1433" text-anchor="start">SOURCE</text><text x="16.0" y="113.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">repository code</text><text x="16.0" y="135.4" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">and frozen profiles</text><rect x="0.0" y="220.0" width="200.0" height="160.0" rx="10" fill="#FFFFFF" stroke="#D8DEEA" stroke-width="1.2"/><rect x="0.0" y="220.0" width="200.0" height="5.0" rx="0" fill="url(#box-slide-tri)"/><rect x="16.0" y="236.0" width="96.7" height="20.0" rx="2" fill="#C4F000"/><text x="23.0" y="251.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="12.9" font-weight="600" fill="#0B1433" text-anchor="start" letter-spacing="0.08em">READ-ONLY</text><text x="16.0" y="285.7" font-family="'Big Shoulders Display', 'Bahnschrift SemiBold Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif" font-size="29.1" font-weight="800" fill="#0B1433" text-anchor="start">MATCH DATA</text><text x="16.0" y="313.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">local folder, never</text><text x="16.0" y="335.4" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">committed or uploaded</text><rect x="250.0" y="0.0" width="470.0" height="400.0" rx="14" fill="#FFFFFF" stroke="#0B1433" stroke-width="1.6"/><rect x="250.0" y="0.0" width="470.0" height="6.0" rx="0" fill="url(#box-slide-tri)"/><text x="270.0" y="34.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="13.4" font-weight="600" fill="#3D4670" text-anchor="start" letter-spacing="0.12em">CONTAINER · PINNED BY SHA256 DIGEST</text><text x="270.0" y="70.0" font-family="'Big Shoulders Display', 'Bahnschrift SemiBold Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif" font-size="26.9" font-weight="800" fill="#0B1433" text-anchor="start">python:3.11.11-slim-bookworm</text><text x="270.0" y="96.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">numpy 2.2.6 · pandas 2.2.3 · 4 pinned dependencies</text><text x="270.0" y="116.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">linux/arm64 · linux/amd64 · offline build from wheels</text><rect x="270.0" y="136.0" width="143.4" height="26.0" rx="4" fill="#0B1433"/><text x="279.0" y="154.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="14.0" font-weight="600" fill="#C4F000" text-anchor="start">--network none</text><rect x="423.4" y="136.0" width="170.3" height="26.0" rx="4" fill="#0B1433"/><text x="432.4" y="154.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="14.0" font-weight="600" fill="#C4F000" text-anchor="start">read-only root fs</text><rect x="603.8" y="136.0" width="107.6" height="26.0" rx="4" fill="#0B1433"/><text x="612.8" y="154.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="14.0" font-weight="600" fill="#C4F000" text-anchor="start">tmpfs /tmp</text><rect x="270.0" y="190.0" width="205.0" height="74.0" rx="8" fill="#F7F6FB" stroke="#D8DEEA"/><text x="284.0" y="220.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="16.8" font-weight="600" fill="#0B1433" text-anchor="start">possession.run</text><text x="284.0" y="244.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14.6" font-weight="400" fill="#3D4670" text-anchor="start">decode, profile macro</text><rect x="495.0" y="190.0" width="205.0" height="74.0" rx="8" fill="#F7F6FB" stroke="#D8DEEA"/><text x="509.0" y="220.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="16.8" font-weight="600" fill="#0B1433" text-anchor="start">official validator</text><text x="509.0" y="244.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14.6" font-weight="400" fill="#3D4670" text-anchor="start">on every file</text><path d="M475 227 L493 227" fill="none" stroke="#7C84AA" stroke-width="1.6" marker-end="url(#box-slide-arrow)"/><text x="270.0" y="300.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="700" fill="#0B1433" text-anchor="start">no randomness: byte-identical output, LF line endings</text><text x="270.0" y="322.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">under 10 s on a laptop CPU</text><text x="270.0" y="370.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="14.6" font-weight="400" fill="#7C84AA" text-anchor="start">15 behaviour tests run in the same image, no data needed</text><path d="M200 100 C226 100 226 120 246 120" fill="none" stroke="#7C84AA" stroke-width="1.6" marker-end="url(#box-slide-arrow)"/><path d="M200 300 C226 300 226 280 246 280" fill="none" stroke="#7C84AA" stroke-width="1.6" marker-end="url(#box-slide-arrow)"/><rect x="770.0" y="150.0" width="230.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#D8DEEA" stroke-width="1.2"/><rect x="770.0" y="150.0" width="230.0" height="5.0" rx="0" fill="url(#box-slide-tri)"/><rect x="786.0" y="166.0" width="87.5" height="20.0" rx="2" fill="#C4F000"/><text x="793.0" y="181.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="12.9" font-weight="600" fill="#0B1433" text-anchor="start" letter-spacing="0.08em">WRITABLE</text><text x="786.0" y="215.7" font-family="'Big Shoulders Display', 'Bahnschrift SemiBold Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif" font-size="29.1" font-weight="800" fill="#0B1433" text-anchor="start">OUTPUTS</text><text x="786.0" y="243.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">separate folder, outside</text><text x="786.0" y="265.4" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">the repository; published</text><text x="786.0" y="287.8" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">figures are aggregates</text><path d="M720 235 L764 235" fill="none" stroke="#7C84AA" stroke-width="1.6" marker-end="url(#box-slide-arrow)"/><rect x="770.0" y="20.0" width="230.0" height="96.0" rx="10" fill="none" stroke="#A50044" stroke-width="1.4" stroke-dasharray="5 5"/><text x="786.0" y="50.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="13.4" font-weight="600" fill="#A50044" text-anchor="start" letter-spacing="0.12em">NO ROUTE OUT</text><text x="786.0" y="76.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="700" fill="#0B1433" text-anchor="start">no cloud, no hosted</text><text x="786.0" y="96.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="700" fill="#0B1433" text-anchor="start">model, no upload</text><line x1="726.0" y1="68.0" x2="748.0" y2="68.0" stroke="#A50044" stroke-width="1.4" stroke-dasharray="5 5"/><path d="M749 61L763 75M763 61L749 75" stroke="#A50044" stroke-width="2.6" stroke-linecap="round"/></svg>
