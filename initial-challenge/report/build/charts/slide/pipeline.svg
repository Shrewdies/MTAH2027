<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="pipe-slide-t pipe-slide-d"><title id="pipe-slide-t">From tracking and tags to one label per frame</title><desc id="pipe-slide-d">Tracking feeds both questions, is the ball alive and which team has it; calibrated tags feed only the team question. Viterbi turns the evidence into one coherent H, A, D sequence.</desc><defs><marker id="pipe-slide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C84AA"/></marker><pattern id="pipe-slide-stripes" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="6" height="10" fill="#004D98"/><rect x="6" width="6" height="10" fill="#A50044"/></pattern></defs><rect x="0.0" y="20.0" width="190.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#D8DEEA" stroke-width="1.2"/><rect x="0.0" y="20.0" width="190.0" height="5.0" rx="0" fill="url(#pipe-slide-stripes)"/><text x="16.0" y="50.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="13.4" font-weight="600" fill="#3D4670" text-anchor="start" letter-spacing="0.14em">INPUT</text><text x="16.0" y="85.7" font-family="'Big Shoulders Display', 'Bahnschrift SemiBold Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif" font-size="30.2" font-weight="800" fill="#0B1433" text-anchor="start">TRACKING</text><text x="16.0" y="115.1" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">22 players + ball</text><text x="16.0" y="137.5" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">team only, no identities</text><text x="16.0" y="159.9" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">ball missing on 41%</text><rect x="0.0" y="230.0" width="190.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#D8DEEA" stroke-width="1.2"/><rect x="0.0" y="230.0" width="190.0" height="5.0" rx="0" fill="url(#pipe-slide-stripes)"/><text x="16.0" y="260.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="13.4" font-weight="600" fill="#3D4670" text-anchor="start" letter-spacing="0.14em">INPUT</text><text x="16.0" y="295.7" font-family="'Big Shoulders Display', 'Bahnschrift SemiBold Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif" font-size="30.2" font-weight="800" fill="#0B1433" text-anchor="start">TAGS</text><text x="16.0" y="325.1" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">automatic tactical tags</text><text x="16.0" y="347.5" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">14 codes name a team</text><rect x="238.0" y="0.0" width="262.0" height="400.0" rx="14" fill="none" stroke="#D8DEEA" stroke-dasharray="4 5"/><text x="254.0" y="28.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="13.4" font-weight="600" fill="#3D4670" text-anchor="start" letter-spacing="0.14em">EVIDENCE, FRAME BY FRAME</text><rect x="252.0" y="46.0" width="234.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#D8DEEA" stroke-width="1.2"/><rect x="252.0" y="46.0" width="234.0" height="5.0" rx="0" fill="url(#pipe-slide-stripes)"/><text x="268.0" y="76.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="13.4" font-weight="600" fill="#3D4670" text-anchor="start" letter-spacing="0.14em">IS THE BALL ALIVE?</text><text x="268.0" y="111.7" font-family="'Big Shoulders Display', 'Bahnschrift SemiBold Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif" font-size="30.2" font-weight="800" fill="#0B1433" text-anchor="start">ALIVE OR DEAD</text><text x="268.0" y="141.1" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">out of play, standing still,</text><text x="268.0" y="163.5" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">ball placed, set piece start</text><rect x="252.0" y="230.0" width="234.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#D8DEEA" stroke-width="1.2"/><rect x="252.0" y="230.0" width="234.0" height="5.0" rx="0" fill="url(#pipe-slide-stripes)"/><text x="268.0" y="260.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="13.4" font-weight="600" fill="#3D4670" text-anchor="start" letter-spacing="0.14em">WHICH TEAM HAS IT?</text><text x="268.0" y="295.7" font-family="'Big Shoulders Display', 'Bahnschrift SemiBold Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif" font-size="30.2" font-weight="800" fill="#0B1433" text-anchor="start">HOME OR AWAY</text><text x="268.0" y="325.1" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">player within 1.5 m of a ball</text><text x="268.0" y="347.5" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">slower than 7 m/s; tag hint</text><path d="M190 95 C216 95 222 121 250 121" fill="none" stroke="#7C84AA" stroke-width="1.6" marker-end="url(#pipe-slide-arrow)"/><path d="M190 95 C222 95 218 295 250 295" fill="none" stroke="#7C84AA" stroke-width="1.6" marker-end="url(#pipe-slide-arrow)"/><path d="M190 335 L250 335" fill="none" stroke="#7C84AA" stroke-width="1.6" marker-end="url(#pipe-slide-arrow)"/><rect x="542.0" y="20.0" width="222.0" height="360.0" rx="10" fill="#FFFFFF" stroke="#D8DEEA" stroke-width="1.2"/><rect x="542.0" y="20.0" width="222.0" height="5.0" rx="0" fill="url(#pipe-slide-stripes)"/><text x="558.0" y="50.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="13.4" font-weight="600" fill="#3D4670" text-anchor="start" letter-spacing="0.14em">DECODE</text><text x="558.0" y="84.0" font-family="'Big Shoulders Display', 'Bahnschrift SemiBold Condensed', 'Bahnschrift', 'Arial Narrow', sans-serif" font-size="30.2" font-weight="800" fill="#0B1433" text-anchor="start">VITERBI</text><text x="558.0" y="110.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">best story, not best frame:</text><text x="558.0" y="130.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">evidence minus a fixed cost</text><text x="558.0" y="150.0" font-family="Manrope, 'Segoe UI', system-ui, Arial, sans-serif" font-size="15.7" font-weight="400" fill="#3D4670" text-anchor="start">for every change of state</text><text x="560.0" y="205.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="14.6" font-weight="600" fill="#3D4670" text-anchor="start">H</text><circle cx="590" cy="200" r="3.2" fill="none" stroke="#7C84AA" stroke-width="1.2"/><circle cx="612" cy="200" r="3.2" fill="none" stroke="#7C84AA" stroke-width="1.2"/><circle cx="634" cy="200" r="3.2" fill="none" stroke="#7C84AA" stroke-width="1.2"/><circle cx="656" cy="200" r="3.2" fill="none" stroke="#7C84AA" stroke-width="1.2"/><circle cx="678" cy="200" r="3.2" fill="none" stroke="#7C84AA" stroke-width="1.2"/><circle cx="700" cy="200" r="3.2" fill="none" stroke="#7C84AA" stroke-width="1.2"/><circle cx="722" cy="200" r="3.2" fill="none" stroke="#7C84AA" stroke-width="1.2"/><circle cx="744" cy="200" r="3.2" fill="none" stroke="#7C84AA" stroke-width="1.2"/><text x="560.0" y="255.0" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, monospace" font-size="14.6" font-weight="600" fill="#3D4670" text-anchor="start">A</text><circle cx="590" cy="250"