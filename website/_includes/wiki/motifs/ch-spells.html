{%- comment -%} Spell matching: true spells against predicted spells. One clean match, one split, one merge that swallows a spell. Synthetic. Labels: truth row, predicted row, match, split, missed. {%- endcomment -%}
{%- assign L = include.labels -%}
<svg class="wm" viewBox="0 0 640 400" aria-hidden="true" focusable="false">
  <text x="50" y="76">{{ L[0] | default: "Truth" | escape }}</text>
  <rect class="wm-h" x="50" y="90" width="150" height="50" rx="6"/>
  <rect class="wm-d" x="204" y="103" width="40" height="24" rx="5" opacity=".8"/>
  <rect class="wm-a" x="248" y="90" width="108" height="50" rx="6"/>
  <rect class="wm-h" x="360" y="90" width="108" height="50" rx="6"/>
  <rect class="wm-a" x="472" y="90" width="118" height="50" rx="6"/>
  <rect class="wm-ln wm-ln--white wm-ln--dash wm-pulse" x="467" y="85" width="128" height="60" rx="10" style="--lo:.2"/>

  <path class="wm-ln wm-ln--lime wm-ln--bold wm-draw" d="M125 146V218" pathLength="100" style="--dur:6s"/>
  <path class="wm-ln wm-ln--white wm-ln--dash" d="M302 146C302 182 271 182 271 218M302 146C302 182 334 182 334 218"/>
  <path class="wm-ln wm-ln--white wm-ln--dash" d="M414 146C414 182 475 182 475 218"/>
  <g class="wm-late" style="--dur:6s">
    <text class="wm-t--xs wm-t--lime" x="137" y="187">IoU 0.93</text>
    <text class="wm-t--xs" x="346" y="187">0.41</text>
    <text class="wm-t--xs" x="462" y="187">0.47</text>
  </g>
  <g transform="translate(531 182)">
    <circle class="wm-a wm-edge wm-pop" r="13" style="--i:3"/>
    <path class="wm-pop" d="M-5 -5l10 10M5 -5l-10 10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" style="--i:3"/>
  </g>

  <rect class="wm-h" x="56" y="224" width="140" height="50" rx="6"/>
  <rect class="wm-d" x="200" y="237" width="46" height="24" rx="5" opacity=".8"/>
  <rect class="wm-a" x="250" y="224" width="42" height="50" rx="6"/>
  <rect class="wm-h wm-blink" x="296" y="224" width="12" height="50" rx="3"/>
  <rect class="wm-a" x="312" y="224" width="44" height="50" rx="6"/>
  <rect class="wm-h" x="360" y="224" width="230" height="50" rx="6"/>
  <text x="50" y="306">{{ L[1] | default: "Predicted" | escape }}</text>

  <circle class="wm-lime" cx="59" cy="352" r="10"/>
  <path d="M54 352l3.8 3.8 6.6-7.6" fill="none" stroke="#0A1F44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="wm-t--s" x="78" y="357">{{ L[2] | default: "Match" | escape }}</text>
  <path class="wm-ln wm-ln--white wm-ln--dash" d="M240 352H262"/>
  <text class="wm-t--s wm-t--dim" x="272" y="357">{{ L[3] | default: "Split or merged" | escape }}</text>
  <circle class="wm-a wm-edge" cx="459" cy="352" r="10"/>
  <path d="M455 348l8 8M463 348l-8 8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <text class="wm-t--s wm-t--dim" x="478" y="357">{{ L[4] | default: "Missed" | escape }}</text>
</svg>
