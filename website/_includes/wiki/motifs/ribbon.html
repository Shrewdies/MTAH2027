{%- comment -%} Noisy per-frame H/A/D strip above the clean decoded strip. Labels: top strip, bottom strip, H, A, D. {%- endcomment -%}
{%- assign L = include.labels -%}
{%- assign cells = "h,h,a,h,h,h,d,h,h,a,h,h,h,a,d,d,h,d,a,a,h,a,a,a,d,a,a,h,a,a,a,h,a,h,h,a,h,h,h,d,h,h,a,h,h" | split: "," -%}
<svg class="wm" viewBox="0 0 640 400" aria-hidden="true" focusable="false">
  <defs><clipPath id="{{ include.uid }}-clip"><rect class="wm-wipe" x="50" y="226" width="540" height="64"/></clipPath></defs>
  <text x="50" y="90">{{ L[0] | default: "Per-frame evidence" | escape }}</text>
  {%- for c in cells %}
  <rect class="wm-{{ c }} wm-pulse" x="{{ forloop.index0 | times: 12 | plus: 50 }}" y="104" width="10" height="56" rx="2" style="--i:{{ forloop.index0 | modulo: 9 }};--lo:.45"/>
  {%- endfor %}
  <path class="wm-ln wm-ln--lime wm-ln--dash" d="M217 168V224M265 168V224M445 168V224"/>
  <g clip-path="url(#{{ include.uid }}-clip)">
    <g class="wm-hold">
      <rect class="wm-h" x="50" y="230" width="166" height="56" rx="6"/>
      <rect class="wm-d" x="218" y="230" width="46" height="56" rx="6"/>
      <rect class="wm-a" x="266" y="230" width="178" height="56" rx="6"/>
      <rect class="wm-h" x="446" y="230" width="142" height="56" rx="6"/>
    </g>
  </g>
  <g transform="translate(590 0)"><g class="wm-travel" style="--fx:-540px;--dur:6s"><path class="wm-ln wm-ln--lime" stroke-width="3" d="M0 98V292"/><path class="wm-lime" d="M-7 88h14l-7 10z"/></g></g>
  <text x="50" y="316">{{ L[1] | default: "Decoded possession" | escape }}</text>
  <rect class="wm-h" x="50" y="349" width="14" height="14" rx="3"/><text class="wm-t--s wm-t--dim" x="72" y="361">{{ L[2] | default: "Home" | escape }}</text>
  <rect class="wm-a" x="240" y="349" width="14" height="14" rx="3"/><text class="wm-t--s wm-t--dim" x="262" y="361">{{ L[3] | default: "Away" | escape }}</text>
  <rect class="wm-d" x="430" y="349" width="14" height="14" rx="3"/><text class="wm-t--s wm-t--dim" x="452" y="361">{{ L[4] | default: "Dead ball" | escape }}</text>
</svg>
