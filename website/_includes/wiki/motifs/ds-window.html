{%- comment -%} The competition match on its tactical clock: where the ball is tracked (gaps drawn for effect, not real positions), and which answers are public. Labels: ball row, answers row, public window, private, first half, second half. {%- endcomment -%}
{%- assign L = include.labels -%}
<svg class="wm" viewBox="0 0 640 400" aria-hidden="true" focusable="false">
  <text class="wm-t--s wm-t--dim" x="70" y="62">{{ L[4] | default: "First half" | truncate: 13, "" | escape }}</text>
  <text class="wm-t--s wm-t--dim" x="340" y="62">{{ L[5] | default: "Second half" | truncate: 13, "" | escape }}</text>
  <text class="wm-t--s" x="70" y="96">{{ L[0] | default: "Ball tracked" | escape }}</text>
  <rect class="wm-panel" x="70" y="106" width="220" height="32" rx="7"/><rect class="wm-panel" x="340" y="106" width="220" height="32" rx="7"/>
  <g class="wm-white">
    <rect class="wm-pulse" x="70" y="106" width="34" height="32" rx="6" style="--i:0;--lo:.7"/><rect class="wm-pulse" x="122" y="106" width="36" height="32" rx="6" style="--i:2;--lo:.7"/><rect class="wm-pulse" x="190" y="106" width="16" height="32" rx="6" style="--i:4;--lo:.7"/><rect class="wm-pulse" x="236" y="106" width="44" height="32" rx="6" style="--i:6;--lo:.7"/>
    <rect class="wm-pulse" x="340" y="106" width="32" height="32" rx="6" style="--i:1;--lo:.7"/><rect class="wm-pulse" x="398" y="106" width="42" height="32" rx="6" style="--i:3;--lo:.7"/><rect class="wm-pulse" x="462" y="106" width="18" height="32" rx="6" style="--i:5;--lo:.7"/><rect class="wm-pulse" x="510" y="106" width="38" height="32" rx="6" style="--i:7;--lo:.7"/>
  </g>
  <text class="wm-t--s" x="70" y="184">{{ L[1] | default: "Answers" | escape }}</text>
  <rect class="wm-panel" x="94" y="194" width="196" height="32" rx="7" stroke-dasharray="5 6"/><rect class="wm-panel" x="340" y="194" width="220" height="32" rx="7" stroke-dasharray="5 6"/>
  <rect class="wm-lime wm-breathe" x="70" y="194" width="21" height="32" rx="6" style="--s:1.08"/>
  <text class="wm-t--xs wm-t--dim" x="192" y="215" text-anchor="middle">{{ L[3] | default: "Private" | escape }}</text>
  <text class="wm-t--xs wm-t--dim" x="450" y="215" text-anchor="middle">{{ L[3] | default: "Private" | escape }}</text>
  <path class="wm-ln wm-ln--lime" d="M80 230V252H96"/>
  <text class="wm-t--s wm-t--lime" x="104" y="257">{{ L[2] | default: "Public window" | escape }}</text>
  <text x="315" y="127" text-anchor="middle" class="wm-t--xs wm-t--dim">HT</text>
  <path class="wm-ticks" d="M70 312H560" opacity=".6"/>
  <path class="wm-ln" d="M70 306H560"/>
  <g text-anchor="middle"><text class="wm-t--xs wm-t--dim" x="70" y="338">0'</text><text class="wm-t--xs wm-t--dim" x="315" y="338">45'</text><text class="wm-t--xs wm-t--dim" x="560" y="338">90'</text></g>
  <g transform="translate(560 0)"><g class="wm-travel" style="--fx:-490px;--dur:6s"><path class="wm-ln wm-ln--lime" stroke-width="2.5" d="M0 100V312"/><path class="wm-lime" d="M-7 90h14l-7 10z"/></g></g>
</svg>
