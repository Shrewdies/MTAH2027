{%- comment -%} A match in two halves, with gaps in one feed and an offset between feeds. Labels: halves, gap, offset. {%- endcomment -%}
{%- assign L = include.labels -%}
<svg class="wm" viewBox="0 0 640 400" aria-hidden="true" focusable="false">
  <text x="70" y="98" class="wm-t--s">{{ L[0] | default: "First half" | truncate: 13, "" | escape }}</text>
  <text x="340" y="98" class="wm-t--s">{{ L[1] | default: "Second half" | truncate: 13, "" | escape }}</text>
  <rect class="wm-h" x="70" y="112" width="220" height="36" rx="7"/><rect class="wm-h" x="340" y="112" width="220" height="36" rx="7"/>
  <text x="315" y="135" text-anchor="middle" class="wm-t--xs wm-t--dim">HT</text>
  <g fill="#8E6FC4"><rect x="96" y="204" width="80" height="36" rx="7"/><rect x="206" y="204" width="110" height="36" rx="7"/><rect x="366" y="204" width="104" height="36" rx="7"/><rect x="496" y="204" width="90" height="36" rx="7"/></g>
  <g class="wm-ln wm-ln--lime wm-ln--dash"><rect class="wm-pulse" x="179" y="207" width="24" height="30" rx="5" style="--lo:.25"/><rect class="wm-pulse" x="473" y="207" width="20" height="30" rx="5" style="--i:5;--lo:.25"/></g>
  <path class="wm-ln wm-ln--lime" d="M191 246V262M483 246V262M191 262H483"/>
  <text x="337" y="286" text-anchor="middle" class="wm-t--s wm-t--lime">{{ L[2] | default: "Gap" | escape }}</text>
  <path class="wm-ln wm-ln--white wm-pulse" d="M70 156V196M96 164V196M70 180H96" style="--lo:.4"/>
  <text x="106" y="186" class="wm-t--s">{{ L[3] | default: "Offset" | escape }}</text>
  <path class="wm-ticks" d="M70 326H586" opacity=".6"/>
  <path class="wm-ln" d="M70 320H586"/>
  <g text-anchor="middle"><text class="wm-t--xs wm-t--dim" x="70" y="352">0'</text><text class="wm-t--xs wm-t--dim" x="290" y="352">45'</text><text class="wm-t--xs wm-t--dim" x="560" y="352">90'</text></g>
  <g transform="translate(586 0)"><g class="wm-travel" style="--fx:-516px;--dur:6s"><path class="wm-ln wm-ln--lime" stroke-width="2.5" d="M0 108V326"/><path class="wm-lime" d="M-7 98h14l-7 10z"/></g></g>
</svg>
