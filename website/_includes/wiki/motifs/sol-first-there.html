{%- comment -%} Solutions family "physics and features": closest is not first. A standing receiver is nearer the ball; a sprinting presser reaches it sooner. Distance and time to intercept give opposite answers. Synthetic. {%- endcomment -%}

  <circle class="wm-ln wm-ln--dash" cx="540" cy="92" r="11"/><text class="wm-t--xs wm-t--dim" x="540" y="68" text-anchor="middle">Sprinting</text>
