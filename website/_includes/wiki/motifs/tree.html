  <path class="wm-ln" d="M410 84L318 168M410 84L502 168M318 168L272 252M318 168L364 252M502 168L456 252M502 168L548 252M272 252L249 318M272 252L295 318M364 252L341 318M364 252L387 318M456 252L433 318M456 252L479 318M548 252L525 318M548 252L571 318"/>
